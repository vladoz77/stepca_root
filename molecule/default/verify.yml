# molecule/default/verify.yml
---
- name: Verify
  hosts: all:!stepca
  gather_facts: false
  vars:
    step_ca_host: https://stepca:9000
  tasks:
    - name: System trust store accepts the step-ca certificate
      ansible.builtin.uri:
        url: "{{ step_ca_host }}/health"
        validate_certs: true
        return_content: true
        status_code: 200
        timeout: 30
      register: health
      retries: 5
      delay: 3
      until: health.status == 200
      failed_when: health.status != 200 or 'ok' not in health.content